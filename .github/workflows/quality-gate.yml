name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend tests and RAG eval
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest tests

      - name: Run offline RAG eval quality gate
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: >
          python -m app.evals.run_rag_answer_eval
          --ci-mode
          --min-pass-rate 1.0
          --no-save-report

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/react-chat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/react-chat/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
